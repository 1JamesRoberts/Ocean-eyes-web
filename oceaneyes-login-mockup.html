<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#041426" />
    <title>OceanEyes — Sign in</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f7fbff;
        --muted: #b9cbe0;
        --cyan: #80efff;
        --blue: #3d91ff;
        --deep: #031426;
        --card: rgba(9, 34, 63, 0.76);
        --card-border: rgba(157, 235, 255, 0.78);
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        overflow-x: hidden;
        background: var(--deep);
        color: var(--ink);
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button, a { font: inherit; }

      .scene {
        position: relative;
        min-height: 100svh;
        isolation: isolate;
        overflow: hidden;
        display: grid;
        place-items: center;
        padding: clamp(22px, 4vw, 52px) 20px 36px;
        background:
          radial-gradient(ellipse at 50% 2%, rgba(42, 150, 255, 0.36), transparent 30%),
          linear-gradient(180deg, #071f38 0%, #05213b 42%, #031426 100%);
      }

      .scene::before {
        content: "";
        position: absolute;
        z-index: -4;
        inset: 0;
        opacity: 0.6;
        background:
          radial-gradient(circle at 20% 32%, rgba(101, 213, 255, 0.16) 0 1px, transparent 2px),
          radial-gradient(circle at 82% 22%, rgba(101, 213, 255, 0.15) 0 1px, transparent 2px),
          radial-gradient(circle at 65% 50%, rgba(101, 213, 255, 0.12) 0 1px, transparent 2px);
        background-size: 170px 210px, 230px 260px, 190px 240px;
      }

      .waterline {
        position: absolute;
        z-index: -3;
        inset: -8% -12% auto;
        height: 22%;
        opacity: 0.75;
        background: repeating-linear-gradient(165deg, transparent 0 22px, rgba(149, 235, 255, 0.12) 23px 25px, transparent 26px 53px);
        filter: blur(3px);
        transform: perspective(420px) rotateX(55deg);
      }

      .rays {
        position: absolute;
        z-index: -2;
        inset: -4% 18% 25%;
        opacity: 0.55;
        background: conic-gradient(from 174deg at 50% 0%, transparent 0deg, rgba(90, 215, 255, 0.13) 13deg, transparent 23deg, rgba(90, 215, 255, 0.16) 36deg, transparent 48deg, rgba(90, 215, 255, 0.1) 64deg, transparent 77deg);
        filter: blur(8px);
        clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%);
        animation: rayDrift 12s ease-in-out infinite alternate;
      }

      .silt {
        position: absolute;
        z-index: -1;
        inset: auto -8% -10%;
        height: 32%;
        background:
          radial-gradient(ellipse at 50% 80%, rgba(25, 74, 65, 0.95), transparent 56%),
          linear-gradient(165deg, transparent 0 34%, rgba(3, 23, 32, 0.9) 35% 100%);
        clip-path: polygon(0 40%, 7% 35%, 17% 41%, 29% 31%, 38% 38%, 50% 28%, 60% 37%, 73% 30%, 87% 40%, 100% 28%, 100% 100%, 0 100%);
      }

      .plant-bed {
        position: absolute;
        z-index: -1;
        inset: auto -4% -3%;
        height: 42%;
        opacity: 0.93;
        background:
          linear-gradient(76deg, transparent 0 4%, rgba(68, 158, 110, 0.75) 4.2% 5%, transparent 5.2% 13%, rgba(72, 183, 106, 0.7) 13.2% 14%, transparent 14.2% 23%, rgba(49, 148, 111, 0.65) 23.2% 24%, transparent 24.2% 100%),
          radial-gradient(ellipse at 50% 92%, #071d23 0 46%, transparent 67%);
        filter: blur(0.2px);
        clip-path: polygon(0 44%, 6% 32%, 12% 42%, 18% 20%, 25% 41%, 32% 27%, 39% 44%, 47% 17%, 54% 40%, 61% 24%, 69% 42%, 77% 16%, 85% 39%, 93% 23%, 100% 38%, 100% 100%, 0 100%);
      }

      .plant-bed::before,
      .plant-bed::after {
        content: "";
        position: absolute;
        bottom: 0;
        width: 55%;
        height: 100%;
        background: repeating-linear-gradient(78deg, transparent 0 14px, rgba(42, 166, 104, 0.72) 15px 18px, transparent 19px 31px);
        transform-origin: bottom center;
        animation: plantsSway 5s ease-in-out infinite alternate;
      }

      .plant-bed::before { left: -8%; transform: rotate(-5deg); }
      .plant-bed::after { right: -8%; transform: scaleX(-1) rotate(-6deg); animation-delay: -1.7s; }

      .driftwood {
        position: absolute;
        z-index: -1;
        right: -8%;
        bottom: 2%;
        width: 52%;
        height: 44%;
        border-left: 18px solid rgba(53, 44, 34, 0.9);
        border-radius: 55% 5% 0 0;
        transform: rotate(-17deg);
        box-shadow: 14px -18px 0 -4px rgba(68, 52, 35, 0.8), 31px -34px 0 -12px rgba(71, 55, 36, 0.76);
        filter: blur(0.25px);
      }

      .fish {
        position: absolute;
        z-index: -1;
        width: 72px;
        height: 28px;
        opacity: 0.66;
        animation: swim 18s linear infinite;
      }

      .fish::before {
        content: "";
        position: absolute;
        inset: 4px 12px 4px 0;
        border-radius: 52% 46% 48% 50%;
        background: linear-gradient(160deg, #77d6eb, #1f537d 60%, #0b2844);
        box-shadow: inset -12px 0 0 rgba(255, 128, 67, 0.62);
      }

      .fish::after {
        content: "";
        position: absolute;
        right: 0;
        top: 4px;
        border-top: 10px solid transparent;
        border-bottom: 10px solid transparent;
        border-right: 21px solid #5595bb;
      }

      .fish.one { top: 14%; left: 7%; animation-delay: -7s; transform: scale(0.76); }
      .fish.two { top: 22%; right: 4%; animation-delay: -12s; transform: scale(0.62) rotateY(180deg); }
      .fish.three { top: 35%; left: -9%; animation-delay: -2s; transform: scale(0.5); }

      .bubble {
        position: absolute;
        z-index: 0;
        bottom: 18%;
        width: 7px;
        height: 7px;
        border: 1px solid rgba(177, 240, 255, 0.48);
        border-radius: 50%;
        animation: bubbleRise 9s ease-in infinite;
      }

      .bubble.a { left: 15%; animation-delay: -5s; }
      .bubble.b { left: 81%; width: 11px; height: 11px; animation-delay: -1s; }
      .bubble.c { left: 73%; width: 5px; height: 5px; animation-delay: -7s; }

      .login-shell {
        width: min(100%, 650px);
        margin-top: -1vh;
        animation: riseIn 900ms var(--ease) both;
      }

      .login-card {
        position: relative;
        overflow: hidden;
        padding: clamp(34px, 8vw, 70px) clamp(24px, 8vw, 68px) clamp(42px, 7vw, 62px);
        border: 1px solid var(--card-border);
        border-radius: clamp(28px, 5vw, 44px);
        background: linear-gradient(145deg, rgba(49, 104, 151, 0.43), var(--card) 48%, rgba(4, 24, 47, 0.83));
        box-shadow: 0 0 0 1px rgba(91, 188, 255, 0.12), 0 0 32px rgba(74, 197, 255, 0.26), 0 28px 70px rgba(0, 0, 0, 0.38);
        backdrop-filter: blur(15px) saturate(1.2);
      }

      .login-card::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(115deg, rgba(255, 255, 255, 0.2), transparent 20% 70%, rgba(95, 221, 255, 0.09));
      }

      .brand, .eyebrow, .intro, .google-button { position: relative; z-index: 1; }

      .brand {
        display: grid;
        justify-items: center;
        gap: 15px;
        margin-bottom: clamp(42px, 8vw, 62px);
      }

      .brand-mark {
        width: clamp(82px, 17vw, 112px);
        filter: drop-shadow(0 6px 15px rgba(71, 214, 255, 0.24));
      }

      .brand-name {
        margin: 0;
        font-size: clamp(42px, 9vw, 68px);
        font-weight: 760;
        letter-spacing: -0.075em;
        line-height: 0.92;
      }

      .brand-name span { color: var(--cyan); }

      .eyebrow {
        margin: 0;
        color: var(--ink);
        font-size: clamp(27px, 5vw, 42px);
        font-weight: 700;
        letter-spacing: -0.045em;
        line-height: 1.12;
        text-align: center;
        text-wrap: balance;
      }

      .intro {
        max-width: 360px;
        margin: 19px auto 54px;
        color: var(--muted);
        font-size: clamp(16px, 2.6vw, 21px);
        line-height: 1.5;
        text-align: center;
      }

      .google-button {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        width: 100%;
        min-height: 74px;
        padding: 17px 22px;
        border: 0;
        border-radius: 23px;
        color: #17263b;
        background: #fcfdff;
        box-shadow: 0 10px 22px rgba(44, 190, 255, 0.24), inset 0 -2px 0 rgba(8, 42, 71, 0.08);
        cursor: pointer;
        font-size: clamp(17px, 3vw, 24px);
        font-weight: 700;
        transition: transform 220ms var(--ease), box-shadow 220ms var(--ease), background 220ms ease;
      }

      .google-button:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(44, 190, 255, 0.34), inset 0 -2px 0 rgba(8, 42, 71, 0.08); }
      .google-button:active { transform: translateY(1px) scale(0.99); }
      .google-button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 5px; }

      .google-button.is-loading { pointer-events: none; }
      .google-button.is-loading .button-label { opacity: 0; }
      .google-button.is-loading::after {
        content: "";
        position: absolute;
        width: 22px;
        height: 22px;
        border: 3px solid rgba(24, 48, 72, 0.2);
        border-top-color: #287cf2;
        border-radius: 50%;
        animation: spin 800ms linear infinite;
      }

      .google-mark {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        color: #4285f4;
        font-family: Arial, sans-serif;
        font-size: 31px;
        font-weight: 800;
        letter-spacing: -0.14em;
        line-height: 1;
      }

      .legal {
        position: relative;
        z-index: 1;
        max-width: 560px;
        margin: 32px auto 0;
        color: rgba(238, 248, 255, 0.84);
        font-size: clamp(12px, 2vw, 15px);
        line-height: 1.55;
        text-align: center;
      }

      .legal a { color: var(--cyan); text-underline-offset: 3px; }
      .legal a:hover { color: #fff; }

      .status {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      @keyframes riseIn { from { opacity: 0; transform: translateY(24px) scale(0.985); } to { opacity: 1; transform: none; } }
      @keyframes rayDrift { from { transform: translateX(-2%) perspective(420px) rotateX(55deg); } to { transform: translateX(2%) perspective(420px) rotateX(55deg); } }
      @keyframes plantsSway { from { transform: rotate(-4deg) skewX(-2deg); } to { transform: rotate(3deg) skewX(2deg); } }
      @keyframes bubbleRise { from { opacity: 0; transform: translateY(50px) scale(0.7); } 18% { opacity: 0.8; } to { opacity: 0; transform: translateY(-65vh) scale(1.16); } }
      @keyframes swim { from { margin-left: -90px; } to { margin-left: calc(100vw + 100px); } }
      @keyframes spin { to { transform: rotate(360deg); } }

      @media (max-width: 520px) {
        .scene { padding: 22px 14px 28px; }
        .login-card { padding-inline: 22px; }
        .brand { margin-bottom: 34px; }
        .intro { margin-bottom: 38px; }
        .google-button { min-height: 64px; border-radius: 19px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
      }
    </style>
  </head>
  <body>
    <main class="scene">
      <div class="waterline" aria-hidden="true"></div>
      <div class="rays" aria-hidden="true"></div>
      <div class="silt" aria-hidden="true"></div>
      <div class="plant-bed" aria-hidden="true"></div>
      <div class="driftwood" aria-hidden="true"></div>
      <div class="fish one" aria-hidden="true"></div>
      <div class="fish two" aria-hidden="true"></div>
      <div class="fish three" aria-hidden="true"></div>
      <div class="bubble a" aria-hidden="true"></div>
      <div class="bubble b" aria-hidden="true"></div>
      <div class="bubble c" aria-hidden="true"></div>

      <section class="login-shell" aria-labelledby="login-title">
        <div class="login-card">
          <div class="brand" aria-label="OceanEyes">
            <svg class="brand-mark" viewBox="0 0 140 105" fill="none" role="img" aria-label="OceanEyes mark">
              <path d="M18 54c18-28 53-39 90-24 10 4 18 10 25 18-12-5-25-9-39-9-25 0-48 12-63 34L18 54Z" stroke="#9FF6FF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="72" cy="51" r="16" stroke="#9FF6FF" stroke-width="9" />
              <path d="M13 70c28 25 67 29 105 10 8-4 14-8 20-14-17 7-34 9-50 7-26-3-45-13-63-27" stroke="#4E9AFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="111" cy="22" r="5" fill="#5DE7FF" />
              <circle cx="124" cy="34" r="3.5" fill="#5DE7FF" />
              <circle cx="119" cy="10" r="2.5" fill="#5DE7FF" />
            </svg>
            <h1 class="brand-name">Ocean<span>Eyes</span></h1>
          </div>

          <h2 class="eyebrow" id="login-title">Smart aquarium monitoring</h2>
          <p class="intro">Track your aquarium with<br />AI-powered insights.</p>

          <button class="google-button" type="button" id="google-login" aria-describedby="login-status">
            <span class="google-mark" aria-hidden="true">G</span>
            <span class="button-label">Continue with Google</span>
          </button>
          <p class="status" id="login-status" role="status" aria-live="polite"></p>
        </div>

        <p class="legal">
          By continuing, you agree to our <a href="#privacy">Privacy Policy</a> and <a href="#terms">Terms of Service</a>
        </p>
      </section>
    </main>

    <script>
      const button = document.querySelector('#google-login');
      const status = document.querySelector('#login-status');

      button.addEventListener('click', () => {
        button.classList.add('is-loading');
        status.textContent = 'Connecting to Google…';

        window.setTimeout(() => {
          button.classList.remove('is-loading');
          status.textContent = 'Demo only — connect Firebase Authentication to enable Google login.';
        }, 900);
      });
    </script>
  </body>
</html>
