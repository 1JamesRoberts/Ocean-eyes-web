html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;fish-motion-photo-defaults&quot; class=&quot;fish-motion&quot;&gt;
  &lt;canvas width=&quot;1080&quot; height=&quot;1080&quot; role=&quot;img&quot; aria-label=&quot;A side-profile fish following the procedural motion stored in the Blender scene&quot;&gt;&lt;/canvas&gt;
  &lt;div class=&quot;viz-controls&quot; aria-label=&quot;Animation controls&quot;&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; data-action=&quot;play&quot;&gt;Pause&lt;/button&gt;
    &lt;label class=&quot;form-label fish-motion__scrub&quot;&gt;
      &lt;span&gt;Frame &lt;output data-output=&quot;frame&quot;&gt;17&lt;/output&gt; / 278&lt;/span&gt;
      &lt;input class=&quot;form-range&quot; data-input=&quot;frame&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;278&quot; step=&quot;1&quot; value=&quot;17&quot;&gt;
    &lt;/label&gt;
    &lt;span class=&quot;text-small text-muted&quot;&gt;Frames 1–278 · all motion values are live&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;fish-motion__parameters&quot; data-parameter-controls aria-label=&quot;Animation parameters&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;style&gt;
  #fish-motion-photo-defaults {
    --water-top: color-mix(in srgb, var(--viz-series-1) 54%, var(--background));
    --water-mid: color-mix(in srgb, var(--viz-series-2) 68%, var(--background));
    --water-bottom: color-mix(in srgb, var(--viz-series-3) 45%, var(--background));
    width: 100%;
    color: var(--foreground);
  }

  #fish-motion-photo-defaults canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1;
    background:
      radial-gradient(circle at 23% 14%, color-mix(in srgb, var(--foreground) 13%, transparent) 0 2%, transparent 18%),
      linear-gradient(180deg, var(--water-top), var(--water-mid) 58%, var(--water-bottom));
  }

  #fish-motion-photo-defaults .viz-controls {
    margin-top: 12px;
  }

  #fish-motion-photo-defaults .fish-motion__scrub {
    flex: 1 1 320px;
    margin: 0;
  }

  #fish-motion-photo-defaults .fish-motion__scrub span,
  #fish-motion-photo-defaults .fish-motion__parameter-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }

  #fish-motion-photo-defaults .fish-motion__parameters {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 24px;
    margin-top: 24px;
  }

  #fish-motion-photo-defaults fieldset {
    min-width: 0;
    margin: 0;
    padding: 0;
    border: 0;
  }

  #fish-motion-photo-defaults legend {
    margin-bottom: 12px;
    font-weight: 500;
  }

  #fish-motion-photo-defaults .fish-motion__parameter-grid {
    display: grid;
    gap: 12px;
  }

  #fish-motion-photo-defaults .fish-motion__parameter {
    min-width: 0;
    margin: 0;
  }

  #fish-motion-photo-defaults output {
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 480px) {
    #fish-motion-photo-defaults .fish-motion__scrub {
      flex-basis: 100%;
      order: 3;
    }
  }
&lt;/style&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;fish-motion-photo-defaults&#x27;);
  const canvas = root.querySelector(&#x27;canvas&#x27;);
  const ctx = canvas.getContext(&#x27;2d&#x27;, { alpha: true });
  const playButton = root.querySelector(&#x27;[data-action=&quot;play&quot;]&#x27;);
  const frameInput = root.querySelector(&#x27;[data-input=&quot;frame&quot;]&#x27;);
  const frameOutput = root.querySelector(&#x27;[data-output=&quot;frame&quot;]&#x27;);
  const parameterControls = root.querySelector(&#x27;[data-parameter-controls]&#x27;);
  const fish = new Image();

  const FIRST_FRAME = 1;
  const LAST_FRAME = 278;
  const MESH_MIN_X = -2.6553857;
  const MESH_MAX_X = 0.1898954;

  // Defaults match the supplied reference configuration; controls that were
  // outside the reference crop retain the prior rendering values.
  const params = {
    fps: 13,
    driverMultiplier: -1,
    timeOffset: 1,
    timeDivider: 48,
    motionDelay: 0.10,
    scaleX: 0.51,
    movementScale: 16,
    waveFrequency: 15,
    waveScale: 1,
    rotationCenterX: -2.5,
    noiseGap: 2,
    slices: 160,
    pxPerUnit: 10,
    fishHeight: 230,
    bodySpan: 300,
    centerX: 0.52,
    centerY: 0.52,
    driftStrength: 0.57,
    bendStrength: 0,
    depthStrength: 0.08,
    sliceWidthScale: 0.62,
    causticRows: 8,
    causticSpacing: 112,
    causticFrequency: 0.016,
    causticPhase: 1.9,
    causticSpeed: 1,
    causticAmplitude: 16,
    causticOpacity: 0.075,
    causticLineWidth: 3,
    shadowOpacity: 0.2,
    shadowBlur: 18,
    shadowOffsetY: 180,
    shadowWidth: 190,
    shadowHeight: 26
  };

  const parameterGroups = [
    {
      label: &#x27;Timing &amp; driver&#x27;,
      controls: [
        { key: &#x27;fps&#x27;, label: &#x27;Playback rate&#x27;, min: 1, max: 60, step: 1, unit: &#x27; fps&#x27; },
        { key: &#x27;driverMultiplier&#x27;, label: &#x27;Frame driver&#x27;, min: -2, max: 2, step: 0.1, precision: 1, unit: &#x27;×&#x27; },
        { key: &#x27;timeOffset&#x27;, label: &#x27;Time offset&#x27;, min: -120, max: 20, step: 1 },
        { key: &#x27;timeDivider&#x27;, label: &#x27;Time divider&#x27;, min: 2, max: 48, step: 0.5, precision: 1 },
        { key: &#x27;noiseGap&#x27;, label: &#x27;Noise sample gap&#x27;, min: 0.01, max: 2, step: 0.01, precision: 2 }
      ]
    },
    {
      label: &#x27;Blender motion&#x27;,
      controls: [
        { key: &#x27;motionDelay&#x27;, label: &#x27;Motion delay&#x27;, min: 0, max: 2, step: 0.01, precision: 2 },
        { key: &#x27;scaleX&#x27;, label: &#x27;Mesh X scale&#x27;, min: 0.2, max: 1.5, step: 0.01, precision: 2 },
        { key: &#x27;movementScale&#x27;, label: &#x27;Movement scale&#x27;, min: 0, max: 16, step: 0.1, precision: 1 },
        { key: &#x27;waveFrequency&#x27;, label: &#x27;Wave frequency&#x27;, min: 0, max: 15, step: 0.1, precision: 1 },
        { key: &#x27;waveScale&#x27;, label: &#x27;Wave scale&#x27;, min: 0, max: 1, step: 0.01, precision: 2 },
        { key: &#x27;rotationCenterX&#x27;, label: &#x27;Rotation center X&#x27;, min: -2.5, max: 0.5, step: 0.01, precision: 2 }
      ]
    },
    {
      label: &#x27;2D fish rendering&#x27;,
      controls: [
        { key: &#x27;slices&#x27;, label: &#x27;Deformation slices&#x27;, min: 24, max: 160, step: 8 },
        { key: &#x27;pxPerUnit&#x27;, label: &#x27;Motion magnification&#x27;, min: 10, max: 140, step: 1, unit: &#x27; px&#x27; },
        { key: &#x27;fishHeight&#x27;, label: &#x27;Fish height&#x27;, min: 80, max: 400, step: 2, unit: &#x27; px&#x27; },
        { key: &#x27;bodySpan&#x27;, label: &#x27;Horizontal body span&#x27;, min: 40, max: 380, step: 2, unit: &#x27; px&#x27; },
        { key: &#x27;centerX&#x27;, label: &#x27;Horizontal position&#x27;, min: 0.1, max: 0.9, step: 0.01, precision: 2 },
        { key: &#x27;centerY&#x27;, label: &#x27;Vertical position&#x27;, min: 0.1, max: 0.9, step: 0.01, precision: 2 },
        { key: &#x27;driftStrength&#x27;, label: &#x27;Global drift&#x27;, min: 0, max: 1.5, step: 0.01, precision: 2 },
        { key: &#x27;bendStrength&#x27;, label: &#x27;Strip rotation&#x27;, min: 0, max: 1, step: 0.01, precision: 2 },
        { key: &#x27;depthStrength&#x27;, label: &#x27;Depth scaling&#x27;, min: 0, max: 0.4, step: 0.01, precision: 2 },
        { key: &#x27;sliceWidthScale&#x27;, label: &#x27;Slice overlap&#x27;, min: 0.25, max: 1.5, step: 0.01, precision: 2 }
      ]
    },
    {
      label: &#x27;Water &amp; shadow&#x27;,
      controls: [
        { key: &#x27;causticRows&#x27;, label: &#x27;Caustic rows&#x27;, min: 0, max: 14, step: 1 },
        { key: &#x27;causticSpacing&#x27;, label: &#x27;Caustic spacing&#x27;, min: 40, max: 200, step: 2, unit: &#x27; px&#x27; },
        { key: &#x27;causticFrequency&#x27;, label: &#x27;Caustic frequency&#x27;, min: 0.004, max: 0.04, step: 0.001, precision: 3 },
        { key: &#x27;causticPhase&#x27;, label: &#x27;Row phase offset&#x27;, min: 0, max: 4, step: 0.1, precision: 1 },
        { key: &#x27;causticSpeed&#x27;, label: &#x27;Caustic speed&#x27;, min: -3, max: 3, step: 0.1, precision: 1, unit: &#x27;×&#x27; },
        { key: &#x27;causticAmplitude&#x27;, label: &#x27;Caustic amplitude&#x27;, min: 0, max: 50, step: 1, unit: &#x27; px&#x27; },
        { key: &#x27;causticOpacity&#x27;, label: &#x27;Caustic opacity&#x27;, min: 0, max: 0.3, step: 0.005, precision: 3 },
        { key: &#x27;causticLineWidth&#x27;, label: &#x27;Caustic line width&#x27;, min: 0.5, max: 8, step: 0.5, precision: 1, unit: &#x27; px&#x27; },
        { key: &#x27;shadowOpacity&#x27;, label: &#x27;Shadow opacity&#x27;, min: 0, max: 0.5, step: 0.01, precision: 2 },
        { key: &#x27;shadowBlur&#x27;, label: &#x27;Shadow blur&#x27;, min: 0, max: 50, step: 1, unit: &#x27; px&#x27; },
        { key: &#x27;shadowOffsetY&#x27;, label: &#x27;Shadow offset Y&#x27;, min: -100, max: 300, step: 2, unit: &#x27; px&#x27; },
        { key: &#x27;shadowWidth&#x27;, label: &#x27;Shadow width&#x27;, min: 40, max: 400, step: 2, unit: &#x27; px&#x27; },
        { key: &#x27;shadowHeight&#x27;, label: &#x27;Shadow height&#x27;, min: 4, max: 80, step: 1, unit: &#x27; px&#x27; }
      ]
    }
  ];

  const prefersReducedMotion = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
  let playing = !prefersReducedMotion;
  let frame = 17;
  let previousTime = performance.now();

  function formatParameter(control, value) {
    const precision = control.precision ?? (String(control.step).includes(&#x27;.&#x27;) ? 2 : 0);
    return `${Number(value).toFixed(precision)}${control.unit || &#x27;&#x27;}`;
  }

  function buildParameterControls() {
    parameterGroups.forEach(group =&gt; {
      const fieldset = document.createElement(&#x27;fieldset&#x27;);
      const legend = document.createElement(&#x27;legend&#x27;);
      const grid = document.createElement(&#x27;div&#x27;);
      legend.textContent = group.label;
      grid.className = &#x27;fish-motion__parameter-grid&#x27;;

      group.controls.forEach(control =&gt; {
        const label = document.createElement(&#x27;label&#x27;);
        const head = document.createElement(&#x27;span&#x27;);
        const name = document.createElement(&#x27;span&#x27;);
        const output = document.createElement(&#x27;output&#x27;);
        const input = document.createElement(&#x27;input&#x27;);

        label.className = &#x27;form-label fish-motion__parameter&#x27;;
        head.className = &#x27;fish-motion__parameter-head&#x27;;
        name.textContent = control.label;
        output.value = formatParameter(control, params[control.key]);
        output.textContent = output.value;
        input.className = &#x27;form-range&#x27;;
        input.type = &#x27;range&#x27;;
        input.min = String(control.min);
        input.max = String(control.max);
        input.step = String(control.step);
        input.value = String(params[control.key]);
        input.dataset.param = control.key;
        input.setAttribute(&#x27;aria-label&#x27;, control.label);

        input.addEventListener(&#x27;input&#x27;, event =&gt; {
          params[control.key] = Number(event.target.value);
          output.value = formatParameter(control, params[control.key]);
          output.textContent = output.value;
          render();
        });

        head.append(name, output);
        label.append(head, input);
        grid.append(label);
      });

      fieldset.append(legend, grid);
      parameterControls.append(fieldset);
    });
  }

  buildParameterControls();

  function fract(value) {
    return value - Math.floor(value);
  }

  function hash(value, seed) {
    return fract(Math.sin(value * 127.1 + seed * 311.7) * 43758.5453123);
  }

  function fade(value) {
    return value * value * value * (value * (value * 6 - 15) + 10);
  }

  // Smooth deterministic W-noise, used as the 2D analogue of Blender&#x27;s 4D
  // Noise Texture with a fixed zero vector and animated W input.
  function noise(value, seed) {
    const integer = Math.floor(value);
    const decimal = value - integer;
    const amount = fade(decimal);
    const a = hash(integer, seed);
    const b = hash(integer + 1, seed);
    return a + (b - a) * amount;
  }

  function noiseColor(time) {
    return [noise(time, 11), noise(time, 29), noise(time, 47)];
  }

  function nodeFieldAt(modelX, drivenTime) {
    const distance = Math.abs(modelX);
    const delayedTime = drivenTime + Math.pow(distance, 1.5) * params.motionDelay;
    const a = noiseColor(delayedTime).map(value =&gt; value - 0.5);
    const b = noiseColor(delayedTime + params.noiseGap).map(value =&gt; value - 0.5);
    const directionX = a[0] - b[0];
    const directionY = a[1] - b[1];
    const heading = Math.atan2(directionY, directionX);
    const wave = Math.sin(delayedTime * params.waveFrequency) * params.waveScale;
    const rotation = heading + wave;
    const localX = modelX - params.rotationCenterX;

    return {
      x: params.rotationCenterX + Math.cos(rotation) * localX + a[0] * params.movementScale,
      y: Math.sin(rotation) * localX + a[1] * params.movementScale,
      depth: a[2]
    };
  }

  function drawCaustics(frameValue) {
    const style = getComputedStyle(root);
    ctx.save();
    ctx.strokeStyle = style.color;
    ctx.globalAlpha = params.causticOpacity;
    ctx.lineWidth = params.causticLineWidth;
    for (let row = 0; row &lt; Math.round(params.causticRows); row += 1) {
      ctx.beginPath();
      for (let x = -80; x &lt;= 1160; x += 20) {
        const y = 130 + row * params.causticSpacing + Math.sin(
          x * params.causticFrequency +
          row * params.causticPhase +
          frameValue / 24 * params.causticSpeed
        ) * params.causticAmplitude;
        if (x === -80) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawFish(frameValue) {
    if (!fish.complete || !fish.naturalWidth) return;

    const drivenTime = params.timeOffset + frameValue * params.driverMultiplier / params.timeDivider;
    const slices = Math.max(2, Math.round(params.slices));
    const pxPerUnit = params.pxPerUnit;
    const baseHeight = params.fishHeight;
    const centerX = canvas.width * params.centerX;
    const centerY = canvas.height * params.centerY;
    const stripSourceWidth = fish.naturalWidth / slices;

    const points = [];
    for (let index = 0; index &lt; slices; index += 1) {
      const u = (index + 0.5) / slices;
      const originalX = (MESH_MIN_X + (MESH_MAX_X - MESH_MIN_X) * u) * params.scaleX;
      points.push(nodeFieldAt(originalX, drivenTime));
    }

    // Keep the procedural drift visible while centering its usable range in
    // the square frame; relative delay, rotation center, and wave stay intact.
    const anchor = nodeFieldAt(params.rotationCenterX, drivenTime);
    const driftX = (anchor.x - params.rotationCenterX) * pxPerUnit * params.driftStrength;
    const driftY = -anchor.y * pxPerUnit * params.driftStrength;

    ctx.save();
    ctx.globalAlpha = params.shadowOpacity;
    ctx.filter = `blur(${params.shadowBlur}px)`;
    ctx.fillStyle = getComputedStyle(root).color;
    ctx.beginPath();
    ctx.ellipse(centerX, centerY + params.shadowOffsetY, params.shadowWidth, params.shadowHeight, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    for (let index = 0; index &lt; slices; index += 1) {
      const point = points[index];
      const before = points[Math.max(0, index - 1)];
      const after = points[Math.min(slices - 1, index + 1)];
      const tangent = Math.atan2(after.y - before.y, after.x - before.x);
      const screenX = centerX + driftX + (point.x - anchor.x) * pxPerUnit + (index / slices - 0.5) * params.bodySpan;
      const screenY = centerY + driftY - (point.y - anchor.y) * pxPerUnit;
      const depthScale = 1 + point.depth * params.depthStrength;
      const sourceX = index * stripSourceWidth;
      const drawWidth = Math.max(1, (fish.naturalWidth / slices) * params.sliceWidthScale);

      ctx.save();
      ctx.translate(screenX, screenY);
      ctx.rotate(-tangent * params.bendStrength);
      ctx.scale(depthScale, depthScale);
      ctx.drawImage(
        fish,
        sourceX,
        0,
        stripSourceWidth + 1,
        fish.naturalHeight,
        -drawWidth / 2,
        -baseHeight / 2,
        drawWidth + 1,
        baseHeight
      );
      ctx.restore();
    }
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawCaustics(frame);
    drawFish(frame);
    const roundedFrame = Math.round(frame);
    frameOutput.value = String(roundedFrame);
    frameInput.value = String(roundedFrame);
  }

  function tick(now) {
    const elapsed = Math.min(0.1, (now - previousTime) / 1000);
    previousTime = now;
    if (playing) {
      frame += elapsed * params.fps;
      if (frame &gt; LAST_FRAME) frame = FIRST_FRAME + (frame - LAST_FRAME - 1);
      render();
    }
    requestAnimationFrame(tick);
  }

  playButton.addEventListener(&#x27;click&#x27;, () =&gt; {
    playing = !playing;
    playButton.textContent = playing ? &#x27;Pause&#x27; : &#x27;Play&#x27;;
    playButton.setAttribute(&#x27;aria-pressed&#x27;, String(playing));
    previousTime = performance.now();
  });

  frameInput.addEventListener(&#x27;input&#x27;, event =&gt; {
    playing = false;
    playButton.textContent = &#x27;Play&#x27;;
    playButton.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;);
    frame = Number(event.target.value);
    render();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
