<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OceanEyes Glass Card</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #173f42;
        --muted-ink: #477174;
        --card-fill: rgb(237 252 252 / 42%);
        --card-stroke: rgb(158 201 200 / 72%);
        --inner-light-low: rgb(255 255 255 / 40%);
        --inner-light-high: rgb(255 255 255 / 50%);
        --inner-aqua: rgb(119 191 179 / 50%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        background:
          radial-gradient(circle at 18% 18%, rgb(255 255 255 / 92%) 0 8%, transparent 32%),
          radial-gradient(circle at 76% 28%, #9fded5 0 10%, transparent 34%),
          radial-gradient(circle at 36% 86%, #6eb7ae 0 8%, transparent 30%),
          linear-gradient(145deg, #dff5f1, #8bcac1 52%, #5fa79f);
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        border-radius: 999px;
        pointer-events: none;
      }

      body::before {
        width: 20rem;
        height: 20rem;
        top: -6rem;
        right: -3rem;
        background: rgb(241 255 252 / 34%);
      }

      body::after {
        width: 13rem;
        height: 13rem;
        bottom: -4rem;
        left: 5%;
        background: rgb(33 120 118 / 18%);
      }

      .card {
        width: min(88vw, 420px);
        min-height: 250px;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        isolation: isolate;
        overflow: hidden;
        border: 0;
        border-radius: 28px;
        background: var(--card-fill);
        -webkit-backdrop-filter: blur(22px);
        backdrop-filter: blur(22px);
        box-shadow:
          inset 0 0 0 2px var(--card-stroke),
          inset 0 5px 5px 0 var(--inner-light-low),
          inset 1px -5px 5px 0 var(--inner-light-high),
          inset 0 2px 0 0 var(--inner-aqua);
      }

      .eyebrow {
        margin: 0 0 1rem;
        font-family: "Trebuchet MS", sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 9ch;
        margin: 0;
        font-size: clamp(2.25rem, 9vw, 3.4rem);
        font-weight: 400;
        line-height: 0.95;
        letter-spacing: -0.045em;
      }

      .status {
        margin: 2.5rem 0 0;
        display: flex;
        align-items: center;
        gap: 0.65rem;
        color: var(--muted-ink);
        font-family: "Trebuchet MS", sans-serif;
        font-size: 0.86rem;
      }

      .status::before {
        content: "";
        width: 0.62rem;
        height: 0.62rem;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #2c8e7f;
        box-shadow: 0 0 0 5px rgb(44 142 127 / 12%);
      }

      @media (prefers-reduced-motion: no-preference) {
        .card {
          animation: arrive 700ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
        }

        @keyframes arrive {
          from {
            opacity: 0;
            transform: translateY(18px) scale(0.98);
          }
        }
      }
    </style>
  </head>
  <body>
    <article class="card" aria-labelledby="card-title">
      <div>
        <p class="eyebrow">OceanEyes · Live habitat</p>
        <h1 id="card-title">Water looks clear.</h1>
      </div>
      <p class="status">Monitoring normally</p>
    </article>
  </body>
</html>
